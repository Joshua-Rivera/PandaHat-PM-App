# Builds backend/ and deploys it to Cloud Run when main changes (after CI passes).
# The frontend deploys itself: Firebase App Hosting watches the repo.
#
# One-time setup is in docs/DEPLOY.md (Workload Identity Federation, so no
# long-lived Google keys are stored in GitHub).
name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: pandahat-api
          region: ${{ vars.GCP_REGION }}
          source: backend
          env_vars: |
            ENVIRONMENT=production
            AUTH_MODE=firebase
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            APP_BASE_URL=${{ vars.APP_BASE_URL }}
          secrets: |
            DATABASE_URL=pandahat-database-url:latest
            BOOTSTRAP_ADMIN_EMAILS=pandahat-bootstrap-admins:latest
