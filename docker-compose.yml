# Local Postgres for development and tests. Free, and nothing leaves your machine.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pandahat
      POSTGRES_PASSWORD: pandahat   # local-only dev credential
      POSTGRES_DB: pandahat
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql:ro
volumes:
  pgdata:
